; Raises PHP's own upload ceiling above our app-level limits (8MB in
; daily-logs/photo.php, 25MB for documents/submittals files, up to 150MB for
; the video types documents/submittals now also accept). Without this,
; PHP's stock defaults (commonly 2M upload_max_filesize on shared hosting)
; reject the request before our code ever runs. .user.ini (rather than
; .htaccess) works whether the host runs mod_php, PHP-FPM, or suPHP.
upload_max_filesize = 150M
post_max_size = 150M
display_errors = Off
