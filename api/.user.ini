; Raises PHP's own upload ceiling above our app-level 8MB limits in
; daily-logs/photo.php (and future documents/submittals/punch-items uploads).
; Without this, PHP's stock defaults (commonly 2M upload_max_filesize on
; shared hosting) reject the request before our code ever runs. .user.ini
; (rather than .htaccess) works whether the host runs mod_php, PHP-FPM, or
; suPHP.
upload_max_filesize = 10M
post_max_size = 10M
display_errors = Off
